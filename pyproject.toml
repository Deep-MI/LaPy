[build-system]
requires = ['setuptools >= 77.0.0']
build-backend = 'setuptools.build_meta'

[project]
name = 'lapy'
version = '1.7.0'
description = 'A package for differential geometry on meshes (Laplace, FEM)'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11'
authors = [
    {name = 'Martin Reuter', email = 'martin.reuter@dzne.de'},
]
maintainers = [
    {name = 'Martin Reuter', email = 'martin.reuter@dzne.de'},
]
keywords = [
    'python',
    'Laplace',
    'FEM',
    'ShapeDNA',
    'BrainPrint',
    'Triangle Mesh',
    'Tetrahedra Mesh',
    'Geodesics in Heat',
    'Mean Curvature Flow',
]
classifiers = [
    'Operating System :: Microsoft :: Windows',
    'Operating System :: Unix',
    'Operating System :: MacOS',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Natural Language :: English',
    'Intended Audience :: Science/Research',
]
dependencies = [
    'nibabel>=4.0',
    'numpy>=1.23.2',
    'plotly>=5.0',
    'psutil>=5.9',
    'scipy>=1.9.2,!=1.13.0',
]

[project.optional-dependencies]
build = [
    'build',
    'twine',
]
chol = [
    'cholespy>=2.0',
]
doc = [
    'furo!=2023.8.17',
    'matplotlib',
    'numpydoc',
    'sphinx>=7.0,!=7.2.*',
    'sphinxcontrib-bibtex',
    'sphinx-copybutton',
    'sphinx-design',
    'nbsphinx',
    'IPython', # For syntax highlighting in notebooks
    'ipykernel',
]
style = [
    'bibclean',
    'codespell',
    'ruff',
]
test = [
    'pytest',
    'pytest-cov',
    'pytest-timeout',
]
all = [
    'lapy[build]',
    'lapy[chol]',
    'lapy[doc]',
    'lapy[style]',
    'lapy[test]',
]

[project.urls]
homepage = 'https://Deep-MI.github.io/LaPy/dev/index.html'
documentation = 'https://Deep-MI.github.io/LaPy/dev/index.html'
source = 'https://github.com/Deep-MI/LaPy'
tracker = 'https://github.com/Deep-MI/LaPy/issues'

[project.scripts]
lapy-sys_info = 'lapy.commands.sys_info:run'

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ['lapy*']
exclude = ['lapy*tests']

[tool.ruff]
line-length = 120
extend-exclude = [
    "doc",
    ".github",
    "data",
]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "I",   # isort
    "D",   # pydocstyle
    # "SIM", # flake8-simplify
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D107",  # missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"examples/*" = ["E501", "D"]   # long lines and no docstrings in example ipynb
"**/tests/*" = ["D"]

[tool.codespell]
ignore-words-list = 'coo,daty'
check-filenames = true
check-hidden = true
skip = './.git,./build,./.mypy_cache,./.pytest_cache'

[tool.pytest.ini_options]
minversion = '6.0'
addopts = '--durations 20 --junit-xml=junit-results.xml --verbose'
# Our own deprecation warnings are bugs waiting to become errors: a removed
# 2-D np.cross and an in-place .shape assignment both reached CI as hard
# failures before this was turned on. Scoped to lapy so that a deprecation
# inside numpy, scipy or plotly cannot break CI on a dependency bump.
filterwarnings = ['error::DeprecationWarning:lapy.*']

[tool.coverage.run]
branch = true
cover_pylib = false
omit = [
    '**/__init__.py',
    '**/lapy/_version.py',
    '**/lapy/commands/*',
    '**/tests/**',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'if __name__ == .__main__.:',
]
precision = 2
