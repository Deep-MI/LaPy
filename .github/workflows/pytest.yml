name: pytest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

jobs:
  pytest:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # oldest and newest Python on every OS, the versions in between on ubuntu only
        os: [ubuntu, macos, windows]
        python-version: ["3.11", "3.14"]
        include:
          - os: ubuntu
            python-version: "3.12"
          - os: ubuntu
            python-version: "3.13"
    name: ${{ matrix.os }} - py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --progress-bar off --upgrade pip setuptools wheel
          python -m pip install --progress-bar off .[chol,test]
      - name: Display system information
        run: lapy-sys_info --developer
      - name: Run pytest
        run: pytest lapy --cov=lapy --cov-report=xml --cov-config=pyproject.toml
      - name: Upload to codecov
        if: ${{ matrix.os == 'ubuntu' && matrix.python-version == '3.14' && github.repository == 'Deep-MI/LaPy' }}
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests # optional
          name: codecov-umbrella # optional
          #fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)
          token: ${{ secrets.CODECOV_TOKEN }}
          #slug: deep-mi/LaPy

  pytest-min:
    # the lowest versions of the dependencies that pyproject.toml allows
    timeout-minutes: 30
    name: ubuntu - py3.11 - minimum versions
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package with minimum dependencies
        run: |
          python -m pip install --progress-bar off uv
          uv pip install --system pytest pytest-timeout
          uv pip install --system --resolution lowest-direct ".[chol]"
      - name: Display system information
        run: lapy-sys_info --developer
      - name: Run pytest
        run: pytest lapy
